services:
  - type: web
    name: vehicle-damage-detector
    runtime: python
    plan: starter          # 512MB RAM / 0.5 CPU, always-on - change to "free" to try it at $0
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
